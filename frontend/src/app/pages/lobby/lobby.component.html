<div class="lobby">
  <div class="card">
    <h1>Connect 4</h1>
    <p class="subtitle">Play a real-time match with a friend.</p>

    <label class="field">
      <span>Display name</span>
      <input type="text" [(ngModel)]="name" maxlength="20" placeholder="e.g. Alex" />
    </label>

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }

    <div class="actions">
      <button type="button" class="primary" [disabled]="busy()" (click)="createGame()">
        Create game
      </button>

      <div class="divider">or</div>

      <label class="field">
        <span>Room code</span>
        <input
          type="text"
          [(ngModel)]="joinCode"
          maxlength="6"
          placeholder="ABC123"
          class="code-input"
          (keyup.enter)="joinGame()"
        />
      </label>
      <button type="button" class="secondary" [disabled]="busy()" (click)="joinGame()">
        Join game
      </button>

      <div class="divider">or</div>

      <label class="field">
        <span>Bot difficulty</span>
        <select [(ngModel)]="botDifficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </label>
      <button type="button" class="secondary" [disabled]="busy()" (click)="playVsBot()">
        Play vs Bot
      </button>
    </div>
  </div>
</div>
