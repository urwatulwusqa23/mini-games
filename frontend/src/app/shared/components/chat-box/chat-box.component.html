<div class="chat-box">
  <div class="chat-header">Chat</div>

  <div class="chat-messages" #scrollArea>
    @if (messages.length === 0) {
      <div class="chat-empty">No messages yet. Say hello!</div>
    }
    @for (message of messages; track trackByIndex($index)) {
      <div class="chat-message" [class.mine]="isMine(message)">
        <div class="chat-meta">
          <span class="chat-name" [class.red]="message.seat === 'Red'" [class.yellow]="message.seat === 'Yellow'">
            {{ message.name }}
          </span>
          <span class="chat-time">{{ formatTime(message.sentAtUtc) }}</span>
        </div>
        <div class="chat-bubble">{{ message.text }}</div>
      </div>
    }
  </div>

  <form class="chat-input" (submit)="$event.preventDefault(); send()">
    <input
      type="text"
      [(ngModel)]="draft"
      name="chatDraft"
      maxlength="500"
      placeholder="Type a message..."
      autocomplete="off"
    />
    <button type="submit" [disabled]="!draft.trim()">Send</button>
  </form>
</div>
