services:
  - type: web
    name: connect4-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Connect4.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # sync: false means Render leaves this alone after the first deploy -
      # set its real value in the dashboard (Environment tab) to your
      # deployed frontend's URL, e.g. https://connect4-frontend.vercel.app
      # (no trailing slash). Without sync: false, every git-triggered
      # deploy re-syncs this from render.yaml and overwrites whatever
      # you set manually in the dashboard.
      - key: Cors__AllowedOrigins__0
        sync: false
